[package]
name = "anna"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Anna is built on these two: katami is her memory, ax her Claude accounts.
# They're sibling checkouts until they're published somewhere cargo can fetch.
katami = { path = "../katami" }
ax = { path = "../ax" }
anyhow = "1.0.104"
chrono = "0.4.45"
croner = "4.0.0"
# The same version katami builds, so the binary carries one SQLite
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6.0.0"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.0", features = ["json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
usage = { version = "6", package = "usage-rs", features = ["completions"] }
